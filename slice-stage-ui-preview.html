<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bilive 切片流水线 · 阶段界面预览</title>
  <style>
    :root {
      --ink: #1c1f23;
      --ink-2: #3d444d;
      --muted: #7a828c;
      --paper: #f0f2f5;
      --surface: #ffffff;
      --line: #e4e7ec;
      --line-strong: #cfd5dd;
      --accent: #1677ff;
      --accent-weak: #e6f4ff;
      --keep: #389e0d;
      --keep-weak: #f6ffed;
      --warn: #d48806;
      --warn-weak: #fffbe6;
      --drop: #cf1322;
      --drop-weak: #fff1f0;
      --violet: #531dab;
      --violet-weak: #f9f0ff;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 12px rgba(16, 24, 40, 0.06);
      --radius: 10px;
      --font: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --mono: "Cascadia Code", "SF Mono", Consolas, monospace;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--paper);
      font-size: 14px;
      line-height: 1.5;
    }

    button { font-family: inherit; cursor: pointer; }
    button:focus-visible,
    [role="tab"]:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ========== Top pipeline rail ========== */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .topbar-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 20px 0;
    }
    .brand {
      display: flex;
      flex-direction: column;
      min-width: 140px;
    }
    .brand strong { font-size: 15px; letter-spacing: 0.02em; }
    .brand span { color: var(--muted); font-size: 12px; }

    .worker-pill {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--keep-weak);
      color: var(--keep);
      font-size: 12px;
      border: 1px solid #b7eb8f;
    }
    .worker-pill .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--keep);
    }
    .top-actions { display: flex; gap: 8px; }

    .btn {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      color: var(--ink);
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 13px;
      line-height: 1.2;
    }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .btn-primary:hover { background: #4096ff; color: #fff; border-color: #4096ff; }
    .btn-danger { color: var(--drop); border-color: #ffa39e; }
    .btn-danger:hover { background: var(--drop-weak); border-color: var(--drop); color: var(--drop); }
    .btn-ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
    .btn-lg { padding: 10px 18px; font-size: 14px; font-weight: 600; border-radius: 8px; }
    .btn-block { width: 100%; }

    .stage-nav {
      display: flex;
      gap: 4px;
      padding: 8px 12px 0;
      overflow-x: auto;
    }
    .stage-tab {
      appearance: none;
      border: none;
      background: transparent;
      color: var(--ink-2);
      padding: 10px 14px 12px;
      border-radius: 8px 8px 0 0;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
      min-width: 120px;
      border-bottom: 2px solid transparent;
    }
    .stage-tab:hover { background: var(--paper); }
    .stage-tab[aria-selected="true"] {
      color: var(--accent);
      background: var(--accent-weak);
      border-bottom-color: var(--accent);
    }
    .stage-tab .label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13px;
    }
    .stage-tab .step {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }
    .stage-tab[aria-selected="true"] .step { color: var(--accent); }
    .stage-tab .count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }
    .stage-tab[aria-selected="true"] .count { color: var(--accent); }
    .stage-tab .arrow { color: var(--muted); margin-left: 4px; font-weight: 400; }

    .stage-hint {
      padding: 8px 20px 10px;
      color: var(--muted);
      font-size: 12px;
      border-top: 1px dashed var(--line);
      background: #fafbfc;
    }

    /* ========== Shell ========== */
    .stage-root {
      flex: 1;
      padding: 16px 20px 28px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 12px;
      border: 1px solid transparent;
      white-space: nowrap;
    }
    .tag-blue { background: var(--accent-weak); color: var(--accent); border-color: #91caff; }
    .tag-green { background: var(--keep-weak); color: var(--keep); border-color: #b7eb8f; }
    .tag-gold { background: var(--warn-weak); color: var(--warn); border-color: #ffe58f; }
    .tag-red { background: var(--drop-weak); color: var(--drop); border-color: #ffa39e; }
    .tag-purple { background: var(--violet-weak); color: var(--violet); border-color: #d3adf7; }
    .tag-gray { background: #f5f5f5; color: var(--muted); border-color: var(--line); }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-h {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
    }
    .card-h .meta { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
    .card-b { padding: 14px; }

    .muted { color: var(--muted); }
    .mono { font-family: var(--mono); font-size: 12px; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .stack { display: flex; flex-direction: column; gap: 10px; }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .metric {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .metric .k { color: var(--muted); font-size: 12px; }
    .metric .v { font-size: 24px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; }
    .metric .s { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    /* ========== Stage 1: 录播 inventory ========== */
    .s1-layout {
      display: grid;
      grid-template-columns: 220px 1fr 300px;
      gap: 12px;
      align-items: start;
    }
    .filter-list { display: flex; flex-direction: column; gap: 4px; }
    .filter-item {
      text-align: left;
      border: 1px solid transparent;
      background: transparent;
      border-radius: 8px;
      padding: 8px 10px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      color: var(--ink-2);
    }
    .filter-item:hover { background: var(--paper); }
    .filter-item.active {
      background: var(--accent-weak);
      border-color: #91caff;
      color: var(--accent);
      font-weight: 600;
    }
    .filter-item .n { font-family: var(--mono); font-size: 12px; }

    .rec-table { width: 100%; border-collapse: collapse; }
    .rec-table th {
      text-align: left;
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }
    .rec-table td {
      padding: 10px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    .rec-table tr:hover td { background: #fafbfc; }
    .rec-table tr.selected td { background: var(--accent-weak); }
    .rec-title { font-weight: 600; }
    .rec-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }

    .side-panel .kv {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 6px 8px;
      font-size: 13px;
    }
    .side-panel .kv dt { color: var(--muted); }
    .side-panel .kv dd { margin: 0; }

    /* ========== Stage 2: 筛选爆点 ========== */
    .s2-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 12px;
      align-items: start;
    }
    .queue-item {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .queue-item:hover { border-color: var(--accent); }
    .queue-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-weak);
    }
    .queue-item .t { font-weight: 600; }
    .queue-item .m { color: var(--muted); font-size: 12px; margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }

    .density-hero {
      background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
      border-bottom: 1px solid var(--line);
      padding: 16px 16px 8px;
    }
    .density-hero svg { width: 100%; height: 220px; display: block; }
    .density-legend {
      display: flex;
      gap: 14px;
      padding: 8px 4px 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .density-legend i {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 2px;
      margin-right: 4px;
      vertical-align: -1px;
    }

    .burst-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .burst-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 12px;
      background: var(--surface);
    }
    .burst-card .range { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }
    .burst-card .score { font-size: 18px; font-weight: 650; }

    .progress-bar {
      height: 6px;
      background: var(--paper);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar > span {
      display: block;
      height: 100%;
      background: var(--accent);
      border-radius: 999px;
    }

    /* ========== Stage 3: AI判断 ========== */
    .s3-layout {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 12px;
      align-items: start;
    }
    .seg-card {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .seg-card:hover { border-color: var(--accent); }
    .seg-card.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-weak);
    }
    .seg-card.need-human {
      border-left: 3px solid var(--warn);
    }
    .seg-card .title { font-weight: 600; margin-bottom: 4px; }
    .seg-card .scores {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 6px;
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
    }

    .video-stage {
      background: #111;
      border-radius: var(--radius);
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      position: relative;
      overflow: hidden;
    }
    .video-stage .play {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.7);
      display: grid;
      place-items: center;
      background: rgba(0,0,0,0.35);
      font-size: 22px;
    }
    .video-stage .cap {
      position: absolute;
      left: 12px; right: 12px; bottom: 12px;
      display: flex;
      justify-content: space-between;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,0.85);
    }
    .video-stage .sub-mock {
      position: absolute;
      left: 10%; right: 10%;
      bottom: 28%;
      text-align: center;
      font-size: 18px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      font-weight: 600;
    }

    .verdict {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 12px;
    }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .score-box {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    .score-box .n { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
    .score-box .l { font-size: 12px; color: var(--muted); }

    .action-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      padding-top: 4px;
    }

    /* ========== Stage 4: 样片 ========== */
    .s4-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      gap: 12px;
      align-items: start;
    }
    .sample-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .sample-card {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      overflow: hidden;
      box-shadow: var(--shadow);
    }
    .sample-card .thumb {
      aspect-ratio: 16/9;
      background: linear-gradient(135deg, #1f2937, #0f172a);
      color: #fff;
      display: grid;
      place-items: center;
      position: relative;
    }
    .sample-card .thumb .ph { opacity: 0.7; font-size: 13px; }
    .sample-card .body { padding: 12px; }
    .sample-card .body .t { font-weight: 600; margin-bottom: 6px; }
    .sample-card .prog { margin-top: 8px; }
    .sample-card.failed .thumb { background: linear-gradient(135deg, #4c0519, #1f0410); }

    /* ========== Stage 5: 字幕精修 + 上传 ========== */
    .s5-layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      gap: 12px;
      align-items: start;
    }
    .s5-work {
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 12px;
      align-items: start;
    }
    .subtitle-row {
      display: grid;
      grid-template-columns: 36px 72px 1fr;
      gap: 8px;
      align-items: start;
      padding: 8px 6px;
      border-bottom: 1px solid var(--line);
    }
    .subtitle-row:hover { background: #fafbfc; }
    .subtitle-row.active {
      background: var(--accent-weak);
      border-radius: 6px;
    }
    .subtitle-row .idx {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      padding-top: 6px;
    }
    .subtitle-row .time {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--muted);
      padding-top: 6px;
    }
    .subtitle-row textarea {
      width: 100%;
      min-height: 36px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      font-family: inherit;
      font-size: 13px;
      color: var(--ink);
      background: var(--surface);
    }
    .subtitle-row textarea:focus {
      outline: 2px solid var(--accent);
      outline-offset: 0;
      border-color: var(--accent);
    }

    .upload-gate {
      margin-top: 12px;
      border: 1px solid #91caff;
      background: linear-gradient(180deg, var(--accent-weak), #fff);
      border-radius: var(--radius);
      padding: 14px;
    }
    .upload-gate h3 { margin: 0 0 6px; font-size: 15px; }
    .upload-gate p { margin: 0 0 12px; color: var(--ink-2); font-size: 13px; }
    .upload-actions {
      display: grid;
      grid-template-columns: 1fr 1.4fr;
      gap: 8px;
    }

    .rail-item {
      width: 100%;
      text-align: left;
      border: 1px solid var(--line);
      background: var(--surface);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
    }
    .rail-item.active {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-weak);
    }
    .rail-item .t { font-weight: 600; font-size: 13px; }
    .rail-item .m { margin-top: 4px; font-size: 12px; color: var(--muted); }

    .note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    @media (max-width: 1100px) {
      .s1-layout, .s2-layout, .s3-layout, .s4-layout, .s5-layout, .s5-work, .verdict {
        grid-template-columns: 1fr;
      }
      .metrics { grid-template-columns: repeat(2, 1fr); }
      .burst-list, .sample-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .stage-tab, .btn, .queue-item, .seg-card, .rail-item {
        transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <strong>切片流水线</strong>
          <span>阶段看板预览 · 非生产 UI</span>
        </div>
        <div class="top-actions">
          <button class="btn" type="button" id="btn-refresh">刷新</button>
          <button class="btn" type="button">唤醒 Worker</button>
          <button class="btn btn-primary" type="button" id="btn-start">启动切片</button>
        </div>
        <div class="worker-pill" title="Windows 重任务节点">
          <span class="dot"></span>Windows Worker · 空闲 · 待处理 2
        </div>
      </div>
      <nav class="stage-nav" id="stage-nav" role="tablist" aria-label="流水线阶段"></nav>
      <div class="stage-hint" id="stage-hint"></div>
    </header>
    <main class="stage-root" id="stage-root" role="tabpanel"></main>
  </div>

  <script>
    const stages = [
      {
        id: "recordings",
        step: "01",
        label: "录播",
        count: 12,
        hint: "全量源场次库存：查看状态、启动切片、进入整场生命周期。不展示已进入后续阶段的单条切片细节。"
      },
      {
        id: "burst",
        step: "02",
        label: "筛选爆点",
        count: 3,
        hint: "弹幕密度召回阶段：大图看爆点与候选窗，跟踪密度扫描进度。人工补标/失败可从这里进入工作台，但不阻塞自动 keep。"
      },
      {
        id: "judge",
        step: "03",
        label: "AI判断",
        count: 7,
        hint: "MiMo 判断结果与需人工候选：自动 keep 会流向样片；review / 判断失败留在本板并标「需人工」。"
      },
      {
        id: "sample",
        step: "04",
        label: "样片",
        count: 2,
        hint: "成片生产中：finalize / 烧录进度与失败恢复。成片一旦可预览，自动进入「字幕精修」。"
      },
      {
        id: "subtitle",
        step: "05",
        label: "字幕精修",
        count: 4,
        hint: "末板主工作区：预览成片、精修字幕，最后由你决定是否上传。处理链路不会在中间停下来等确认。"
      }
    ];

    const recordings = [
      {
        id: "t1",
        room: "虚拟主播·阿铃",
        title: "阿铃 · 2026-03-12 晚场",
        date: "2026-03-12 20:01",
        status: "done",
        statusText: "流水线完成",
        segments: { keep: 3, review: 1, drop: 2, judge_failed: 0 },
        size: "4.2 GB",
        selected: true
      },
      {
        id: "t2",
        room: "游戏主播·老周",
        title: "老周 · 2026-03-12 排位",
        date: "2026-03-12 19:10",
        status: "processing",
        statusText: "处理中 · AI判断",
        segments: { keep: 1, review: 2, drop: 0, judge_failed: 1 },
        size: "6.8 GB"
      },
      {
        id: "t3",
        room: "虚拟主播·阿铃",
        title: "阿铃 · 2026-03-11 歌回",
        date: "2026-03-11 21:00",
        status: "todo",
        statusText: "待处理",
        segments: { keep: 0, review: 0, drop: 0, judge_failed: 0 },
        size: "3.1 GB"
      },
      {
        id: "t4",
        room: "聊天主播·小满",
        title: "小满 · 2026-03-10 杂谈",
        date: "2026-03-10 22:15",
        status: "failed",
        statusText: "失败 · MiMo 超时",
        segments: { keep: 0, review: 0, drop: 0, judge_failed: 2 },
        size: "2.4 GB"
      }

    function densitySvg() {
      const points = [0.12,0.15,0.18,0.22,0.2,0.25,0.4,0.72,0.88,0.7,0.45,0.3,0.28,0.35,0.55,0.92,0.85,0.5,0.32,0.22,0.18,0.2,0.24,0.3,0.28,0.22,0.4,0.65,0.8,0.55,0.3,0.2];
      const w = 1000, h = 220, pad = 8;
      const step = (w - pad * 2) / (points.length - 1);
      const coords = points.map((p, i) => {
        const x = pad + i * step;
        const y = h - pad - p * (h - pad * 2);
        return [x, y];
      });
      let d = `M ${coords[0][0]} ${h - pad}`;
      coords.forEach(([x, y]) => { d += ` L ${x} ${y}`; });
      d += ` L ${coords[coords.length - 1][0]} ${h - pad} Z`;
      let line = `M ${coords[0][0]} ${coords[0][1]}`;
      coords.forEach(([x, y], i) => { if (i) line += ` L ${x} ${y}`; });

      const windows = [
        { x1: 0.28, x2: 0.38, color: "#1677ff", label: "候选 A" },
        { x1: 0.48, x2: 0.58, color: "#d48806", label: "候选 B" },
        { x1: 0.72, x2: 0.88, color: "#389e0d", label: "候选 C · 当前" }
      ];
      const wins = windows.map((win) => {
        const x = pad + win.x1 * (w - pad * 2);
        const width = (win.x2 - win.x1) * (w - pad * 2);
        return `
          <rect x="${x}" y="${pad}" width="${width}" height="${h - pad * 2}"
            fill="${win.color}" fill-opacity="0.08" stroke="${win.color}" stroke-opacity="0.45" stroke-dasharray="4 3"/>
          <text x="${x + 6}" y="${pad + 16}" fill="${win.color}" font-size="12" font-family="Segoe UI, sans-serif">${win.label}</text>`;
      }).join("");

      return `
        <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-label="弹幕密度与候选窗">
          <path d="${d}" fill="#1677ff" fill-opacity="0.12"/>
          <path d="${line}" fill="none" stroke="#1677ff" stroke-width="2"/>
          ${wins}
        </svg>`;
    }

                    </div>
                    <div class="body">
                      <div class="row" style="justify-content:space-between;">
                        <div class="t">${s.title}</div>
                        ${statusTag(s.state, s.stateText)}
                      </div>
                      <div class="muted mono">${s.meta}</div>
                      <div class="prog">
                        <div class="row" style="justify-content:space-between;margin-bottom:4px;">
                          <span class="muted">阶段进度</span>
                          <span class="mono">${s.progress}%</span>
                        </div>
                        <div class="progress-bar"><span style="width:${s.progress}%;background:${s.failed ? "var(--drop)" : "var(--accent)"}"></span></div>
                      </div>
                      <div class="action-bar" style="margin-top:10px;">
                        ${s.failed
                          ? `<button class="btn btn-primary" type="button">重试成片</button><button class="btn" type="button">失败详情</button>`
                          : `<button class="btn" type="button" disabled>等待完成</button>`}
                      </div>
                    </div>
                  </article>`).join("")}
              </div>
              ${samples.length ? "" : `<div class="empty">当前没有样片生产任务。自动 keep 完成后会短暂出现在这里。</div>`}
            </div>
          </section>
          <aside class="card">
            <div class="card-h">本板规则</div>
            <div class="card-b stack">
              <p style="margin:0;">样片板是<strong>生产进度板</strong>，不是长期库存。</p>
              <ul class="muted" style="margin:0;padding-left:18px;">
                <li>finalize / 烧录进行中 → 停留本板</li>
                <li>失败 → 留在本板，可重试</li>
                <li>成片可预览 → 自动进入字幕精修</li>
              </ul>
              <p class="note">若你希望样片板也长期展示「已生成可观看」，请在反馈里说明，可改成双板可见。</p>
              <button class="btn btn-block" type="button">打开失败工作台</button>
            </div>
          </aside>
        </div>`;
    }

    function renderSubtitle() {
      const sel = subtitleItems.find((s) => s.id === selectedSubtitle) || subtitleItems[0];
      const subs = sel.subtitles.length ? sel.subtitles : subtitleItems[0].subtitles;
      return `
        <div class="metrics">
          <div class="metric"><div class="k">待你决定</div><div class="v">3</div><div class="s">可预览成片</div></div>
          <div class="metric"><div class="k">字幕待重烧</div><div class="v">1</div><div class="s">修改后需 reburn</div></div>
          <div class="metric"><div class="k">已允许发布</div><div class="v">1</div><div class="s">staged / 上传中</div></div>
          <div class="metric"><div class="k">自动上传</div><div class="v" style="font-size:18px;">关闭</div><div class="s">与现网默认一致</div></div>
        </div>
        <div class="s5-layout">
          <aside class="card">
            <div class="card-h">末板队列<span class="meta">可预览成片</span></div>
            <div class="card-b">
              ${subtitleItems.map((item) => `
                <button type="button" class="rail-item ${item.id === selectedSubtitle ? "active" : ""}" data-sub="${item.id}">
                  <div class="row" style="justify-content:space-between;">
                    <div class="t">${item.title}</div>
                    ${statusTag(item.status, item.statusText)}
                  </div>
                  <div class="m">${item.room}</div>
                </button>`).join("")}
              <p class="note">这是你的主工作队列：精修字幕 → 决定上传。</p>
            </div>
          </aside>
          <section class="s5-work">
            <div class="card">
              <div class="card-h">成片预览<span class="meta">${sel.title}</span></div>
              <div class="card-b stack">
                <div class="video-stage">
                  <div class="play">▶</div>
                  <div class="sub-mock">${subs[0]?.text || "示例字幕"}</div>
                  <div class="cap"><span>最终成片 · 00:00:00 起</span><span>版本 1</span></div>
                </div>
                <div class="row">
                  <button class="btn" type="button">源录像对照</button>
                  <button class="btn" type="button">最终成片</button>
                  <span class="muted mono">媒体可预览 · 已进入末板</span>
                </div>
                <dl class="kv" style="display:grid;grid-template-columns:88px 1fr;gap:6px 8px;">
                  <dt class="muted">上传状态</dt><dd style="margin:0;">${sel.statusText}</dd>
                  <dt class="muted">标题</dt><dd style="margin:0;">${sel.title}</dd>
                  <dt class="muted">字幕</dt><dd style="margin:0;">${sel.subtitles.length ? sel.subtitles.length + " 行可编辑" : "当前成片字幕（示例展示）"}</dd>
                </dl>
              </div>
            </div>
            <div class="stack">
              <div class="card">
                <div class="card-h">
                  字幕精修
                  <span class="meta">与预览同屏，不再左右拆散</span>
                </div>
                <div class="card-b" style="padding-top:4px;">
                  ${subs.map((line, i) => `
                    <div class="subtitle-row ${i === 0 ? "active" : ""}">
                      <div class="idx">${i + 1}</div>
                      <div class="time">${line.start}<br/>${line.end}</div>
                      <textarea rows="2">${line.text}</textarea>
                    </div>`).join("")}
                  <div class="action-bar" style="margin-top:10px;">
                    <button class="btn" type="button">新增字幕行</button>
                    <button class="btn" type="button">保存字幕</button>
                    <button class="btn" type="button">重新烧录</button>
                  </div>
                  <p class="note">保存字幕 ≠ 上传。重新烧录后仍在本板，等你决定。</p>
                </div>
              </div>
              <div class="upload-gate">
                <h3>是否上传？</h3>
                <p>确认后将激活上传队列（staged → CDN/B站）。暂不上传会保留成片在本板，可稍后再决定。</p>
                <div class="upload-actions">
                  <button class="btn btn-lg" type="button">暂不上传</button>
                  <button class="btn btn-primary btn-lg" type="button">确认上传</button>
                </div>
                <p class="note">生产语义对应现有「允许发布」；不会在 Dashboard 里直接执行重处理。</p>
              </div>
            </div>
          </section>
        </div>`;
    }

    function renderStageBody() {
      switch (currentStage) {
        case "recordings": return renderRecordings();
        case "burst": return renderBurst();
        case "judge": return renderJudge();
        case "sample": return renderSample();
        case "subtitle": return renderSubtitle();
        default: return renderRecordings();
      }
    }

    function bindStageEvents() {
      root.querySelectorAll("[data-filter]").forEach((el) => {
        el.addEventListener("click", () => { recordingFilter = el.dataset.filter; render(); });
      });
      root.querySelectorAll("[data-rec]").forEach((el) => {
        el.addEventListener("click", (e) => {
          if (e.target.closest("button")) return;
          selectedRecording = el.dataset.rec; render();
        });
      });
      root.querySelectorAll("[data-open]").forEach((el) => {
        el.addEventListener("click", () => { selectedRecording = el.dataset.open; render(); });
      });
      root.querySelectorAll("[data-burst]").forEach((el) => {
        el.addEventListener("click", () => { selectedBurst = el.dataset.burst; render(); });
      });
      root.querySelectorAll("[data-judge]").forEach((el) => {
        el.addEventListener("click", () => { selectedJudge = el.dataset.judge; render(); });
      });
      root.querySelectorAll("[data-sub]").forEach((el) => {
        el.addEventListener("click", () => { selectedSubtitle = el.dataset.sub; render(); });
      });
    }

    function render() {
      renderNav();
      root.innerHTML = renderStageBody();
      root.setAttribute("aria-labelledby", `tab-${currentStage}`);
      bindStageEvents();
    }

    document.getElementById("btn-refresh").addEventListener("click", render);
    document.getElementById("btn-start").addEventListener("click", () => {
      currentStage = "burst";
      render();
    });

    render();
  </script>
</body>
</html>
